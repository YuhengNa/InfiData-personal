datasets:
  - root: "/mnt/data/szeluresearch/InfiData/examples"
    subset: "biplay_dough_cut_full"
    format: "infidata"
    video_key: "auto"

run:
  base_dir: "/mnt/data/szeluresearch/InfiData/examples/biplay_dough_cut_full/video2tasks_runs"
  run_id: "qwen3vl_biplay_dough_cut_full_memory_viz_v2"

server:
  host: "127.0.0.1"
  port: 8110
  max_queue: 8
  inflight_timeout_sec: 600.0
  max_retries_per_job: 5
  auto_exit_after_all_done: false

worker:
  server_url: "http://127.0.0.1:8110"
  backend: "qwen3vl"

  qwen3vl:
    model_path: "Qwen/Qwen3-VL-8B-Instruct"
    device_map: "auto"

  remote_api:
    api_url: "http://127.0.0.1:8080/infer"
    api_key: ""
    timeout_sec: 60.0
    headers: {}

windowing:
  window_sec: 16.0
  step_sec: 8.0
  frames_per_window: 16
  target_width: 720
  target_height: 480
  png_compression: 0

annotation:
  targets:
    - "memory"
    - "subtask"

segmentation:
  mode: "fine"

infidata:
  write_back: true
  update_parquet_subtasks: true

memory:
  use_subtask_context: false 
  align_to_subtasks: true

visualization:
  enabled: true
  output_dir: ""
  panel_height: 180

progress:
  total_override: 0

logging:
  level: "INFO"